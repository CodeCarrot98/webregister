<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Number Register</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f0f4f8;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }
        .card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%; max-width: 450px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 24px; color: #1a202c; margin: 0; }
        .subtitle { color: #718096; font-size: 14px; margin-top: 5px; font-weight: 500; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; }
        input {
            width: 100%; padding: 12px; border: 1px solid #e2e8f0;
            border-radius: 6px; box-sizing: border-box;
        }
        .optional-tag { font-weight: normal; color: #a0aec0; font-size: 12px; }
        
        button {
            width: 100%; padding: 14px; background: #3182ce;
            color: white; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 16px;
        }
        button:hover { background: #2b6cb0; }
        #msg { text-align: center; margin-top: 15px; color: #38a169; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Official Number Register</h1>
        <div class="subtitle">Institute of Neurodevelopment</div>
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="Name" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <label>Official Number</label>
            <input type="text" name="OfficialNumber" placeholder="ID Number" required>
        </div>

        <div class="form-group">
            <label>Smartphone Model <span class="optional-tag">(Optional)</span></label>
            <input type="text" name="SmartphoneModel" placeholder="e.g. iPhone 15, Pixel 8">
        </div>

        <input type="hidden" name="DeviceInfo" id="deviceInfo">

        <button type="submit" id="submitBtn">Submit Data</button>
    </form>
    <div id="msg">Form submitted successfully!</div>
</div>

<script>
    // Auto-detect basic device info
    window.onload = function() {
        const info = `OS: ${navigator.platform} | Browser: ${navigator.appName} | Agent: ${navigator.userAgent}`;
        document.getElementById('deviceInfo').value = info;
    };

    const scriptURL = 'PASTE_YOUR_WEB_APP_URL_HERE';
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "Processing...";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                msg.style.display = "block";
                form.reset();
                btn.disabled = false;
                btn.innerText = "Submit Data";
            })
            .catch(error => alert('Error: ' + error.message));
    });
</script>

</body>
</html>
